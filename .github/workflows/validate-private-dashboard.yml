name: Validate private dashboard
on:
  push:
    branches: [main, v2-private-live-hosting]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - name: Verify no server secrets are committed
        run: |
          test ! -e .env
          test ! -e .env.production
          test ! -e .env.local
